name: Validate project
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q dashboard src
      - run: python scripts/validate_notebooks.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dashboard/static/js/app.js
      - run: docker compose -f dashboard/docker-compose.yml config --quiet
